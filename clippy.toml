# Frames must be the same bytes on every OS: transcendental functions come
# from the portable `mavian_core::m` (libm), not from the system maths library.
disallowed-methods = [
    { path = "f64::sin", reason = "use mavian_core::m::sin" },
    { path = "f64::cos", reason = "use mavian_core::m::cos" },
    { path = "f64::tan", reason = "use mavian_core::m::tan" },
    { path = "f64::sin_cos", reason = "use mavian_core::m::sin_cos" },
    { path = "f64::asin", reason = "use mavian_core::m::asin" },
    { path = "f64::acos", reason = "use mavian_core::m::acos" },
    { path = "f64::atan", reason = "use mavian_core::m::atan" },
    { path = "f64::atan2", reason = "use mavian_core::m::atan2" },
    { path = "f64::powf", reason = "use mavian_core::m::pow" },
    { path = "f64::powi", reason = "use mavian_core::m::powi" },
    { path = "f64::exp", reason = "use mavian_core::m::exp" },
    { path = "f64::ln", reason = "use mavian_core::m::ln" },
    { path = "f64::log2", reason = "use mavian_core::m::log2" },
    { path = "f64::log10", reason = "use mavian_core::m::log10" },
    { path = "f64::tanh", reason = "use mavian_core::m::tanh" },
    { path = "f64::hypot", reason = "use mavian_core::m::hypot" },
    { path = "f64::cbrt", reason = "use mavian_core::m::cbrt" },
    { path = "f32::sin", reason = "use mavian_core::m::sinf" },
    { path = "f32::cos", reason = "use mavian_core::m::cosf" },
    { path = "f32::tan", reason = "use mavian_core::m::tanf" },
    { path = "f32::sin_cos", reason = "use mavian_core::m" },
    { path = "f32::asin", reason = "use mavian_core::m" },
    { path = "f32::acos", reason = "use mavian_core::m" },
    { path = "f32::atan", reason = "use mavian_core::m" },
    { path = "f32::atan2", reason = "use mavian_core::m::atan2f" },
    { path = "f32::powf", reason = "use mavian_core::m::powf" },
    { path = "f32::powi", reason = "use mavian_core::m::powif" },
    { path = "f32::exp", reason = "use mavian_core::m" },
    { path = "f32::ln", reason = "use mavian_core::m" },
    { path = "f32::tanh", reason = "use mavian_core::m" },
    { path = "f32::hypot", reason = "use mavian_core::m" },
]
